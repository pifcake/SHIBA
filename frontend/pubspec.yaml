name: shiba
description: SHIBA - Platform for models and agencies
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^13.2.0

  # State management
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5

  # HTTP
  dio: ^5.4.3+1
  pretty_dio_logger: ^1.3.1

  # Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3

  # Images
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7

  # UI
  cupertino_icons: ^1.0.6
  shimmer: ^3.0.0
  infinite_scroll_pagination: ^4.0.0

  # Utils
  intl: ^0.19.0
  get_it: ^7.7.0
  injectable: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  injectable_generator: ^2.4.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
