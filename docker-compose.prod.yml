version: "3.9"

# Production override. Use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Note: ports 5432, 9000, 9001 remain published by the base compose file.
# Block external access via ufw AND the VPS provider's cloud firewall (recommended),
# because Docker adds iptables rules that bypass ufw's INPUT chain.

services:

  api:
    env_file:
      - .env.prod

  postgres:
    environment:
      POSTGRES_USER: ${DB_USER:-shiba}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-shiba}

  minio:
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}

  minio-init:
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY;
      mc mb --ignore-existing myminio/shiba;
      mc anonymous set download myminio/shiba;
      echo 'MinIO bucket initialized';
      "

  nginx:
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - /opt/shiba/certbot/conf:/etc/letsencrypt:ro
    ports:
      - "443:443"
